version: "3.8"

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pr_sentinal
    ports:
      - "5432:5432"
    volumes:
      - pr_sentinal_pgdata:/var/lib/postgresql/data

volumes:
  pr_sentinal_pgdata:
